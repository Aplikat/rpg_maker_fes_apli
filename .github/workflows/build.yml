name: Build 3DSX
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - run: dkp-pacman -Syu --noconfirm --needed 3ds-dev || true
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: FesLoader
          path: FesLoader.3dsx
